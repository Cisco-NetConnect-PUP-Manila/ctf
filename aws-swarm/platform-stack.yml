version: "3.8"

services:
  frontend:
    image: ${FRONTEND_IMAGE:-local/ctf-frontend:latest}
    networks:
      - ctf-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend.rule=Host(`ctf.${DOMAIN}`)"
        - "traefik.http.routers.frontend.entrypoints=websecure"
        - "traefik.http.routers.frontend.tls.certresolver=myresolver"
        - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  backend:
    image: ${BACKEND_IMAGE:-local/ctf-backend:latest}
    environment:
      - BACKEND_ENV=production
      - DATABASE_URL=postgresql+psycopg://packet_capture:${POSTGRES_PASSWORD}@postgres:5432/packet_capture_ctf
      - FRONTEND_ORIGIN=https://ctf.${DOMAIN}
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_NAME=packet_capture_session
    networks:
      - ctf-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN}`)"
        - "traefik.http.routers.backend.entrypoints=websecure"
        - "traefik.http.routers.backend.tls.certresolver=myresolver"
        - "traefik.http.services.backend.loadbalancer.server.port=8000"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=packet_capture_ctf
      - POSTGRES_USER=packet_capture
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ctf-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == worker

volumes:
  postgres-data:

networks:
  ctf-network:
    external: true
