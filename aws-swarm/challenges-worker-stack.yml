version: "3.8"

services:
  abandoned_project:
    image: ${CHALLENGE_IMAGE_ABANDONED:-local/ctf-abandoned-project:latest}
    networks:
      - ctf-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.abandoned.rule=Host(`abandoned.challs.${DOMAIN}`)"
        - "traefik.http.routers.abandoned.entrypoints=websecure"
        - "traefik.http.routers.abandoned.tls.certresolver=myresolver"
        - "traefik.http.services.abandoned.loadbalancer.server.port=80"

  black_box:
    image: ${CHALLENGE_IMAGE_BLACK_BOX:-local/ctf-black-box:latest}
